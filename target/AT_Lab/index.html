<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Projecte AT</title>

<style>
:root{
  --bg:#eef5ff;
  --card:#ffffff;
  --border:#e4edff;
  --blue:#4f8df7;
  --blue-soft:#7fb3ff;
  --text:#1e293b;
  --muted:#64748b;
  --radius:20px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,#f3f8ff 0%,#eef5ff 100%);
  color:var(--text);
}

.container{
  max-width:980px;
  margin:60px auto;
  padding:0 20px;
}

header{
  text-align:center;
  margin-bottom:40px;
}

h1{
  margin:0;
  font-size:34px;
  font-weight:700;
}

.sub{
  margin-top:8px;
  color:var(--blue);
  font-weight:600;
}

.layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
}

.card h2{
  margin:0 0 16px 0;
  font-size:16px;
  color:var(--blue);
}

.actions{
  display:flex;
  gap:12px;
  margin-bottom:18px;
}

button{
  padding:10px 16px;
  border-radius:14px;
  border:1px solid var(--border);
  background:white;
  font-weight:600;
  cursor:pointer;
}

button.primary{
  background:linear-gradient(180deg,var(--blue-soft),var(--blue));
  color:white;
  border:none;
}

label{
  font-size:13px;
  color:var(--muted);
  margin:8px 0 4px;
  display:block;
}

input{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-bottom:10px;
}

pre{
  background:#0f172a;
  color:#e2e8f0;
  border-radius:16px;
  padding:16px;
  font-size:12px;
  max-height:260px;
  overflow:auto;
}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Projecte AT</h1>
  <div class="sub">Rut Cabus · Karen Cabello</div>
</header>

<div class="layout">

  <div class="card">
    <h2>Accions</h2>

    <div class="actions">
      <button id="btnGetStations" class="primary">Get stations</button>
      <button id="btnGetClients">Get clients</button>
    </div>

    <h2>Subscribe</h2>

    <label>Phone</label>
    <input id="subPhone" placeholder="600111222">

    <label>Stations IDs</label>
    <input id="subStations" placeholder="1,2,3">

    <label>Telegram token</label>
    <input id="subTgToken" placeholder="123:ABC">

    <label>chat_id</label>
    <input id="subChatId" placeholder="123456789">

    <div class="actions">
      <button id="btnSubscribe" class="primary">Subscribe</button>
      <button id="btnClearSub">Clear</button>
    </div>

    <pre id="outSubscribe">{ }</pre>
  </div>

  <div class="card">
    <h2>Output</h2>
    <pre id="outMain">{ }</pre>
  </div>

</div>

</div>

<script src="js/ban.js"></script>
</body>
</html>
