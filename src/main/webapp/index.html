<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projecte AT</title>

<style>
:root{
  --bg1:#0f172a;
  --bg2:#111827;
  --card:#1e293b;
  --accent:#3b82f6;
  --accent-soft:#60a5fa;
  --border:#334155;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
  background:radial-gradient(circle at 20% 20%,#1e3a8a 0%,#0f172a 60%);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */
.header{
  padding:80px 20px 60px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:42px;
  font-weight:700;
  letter-spacing:.5px;
}

.header .authors{
  margin-top:12px;
  font-size:14px;
  color:var(--accent-soft);
  letter-spacing:.3px;
}

/* LAYOUT */
.container{
  max-width:1200px;
  margin:0 auto 80px;
  padding:0 24px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:30px;
  backdrop-filter:blur(8px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  transition:.3s ease;
}

.card:hover{
  transform:translateY(-4px);
}

.section-title{
  font-size:18px;
  margin-bottom:20px;
  color:var(--accent-soft);
}

/* BUTTONS */
.actions{
  display:flex;
  gap:14px;
  margin-bottom:30px;
}

button{
  border:none;
  padding:11px 22px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  background:#0f172a;
  color:var(--text);
  border:1px solid var(--border);
  transition:.2s ease;
}

button.primary{
  background:linear-gradient(135deg,var(--accent),#1d4ed8);
  color:white;
  border:none;
}

button:hover{
  box-shadow:0 8px 30px rgba(59,130,246,.35);
  transform:translateY(-2px);
}

/* FORM */
label{
  display:block;
  margin-top:18px;
  margin-bottom:6px;
  font-size:13px;
  color:var(--muted);
}

input{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0f172a;
  color:var(--text);
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(59,130,246,.25);
}

/* OUTPUT */
pre{
  margin-top:24px;
  background:#0b1220;
  border-radius:16px;
  padding:24px;
  min-height:280px;
  overflow:auto;
  font-size:13px;
  color:#e2e8f0;
  border:1px solid var(--border);
}

/* FOOTER */
.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:40px;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="header">
  <h1>Projecte AT</h1>
  <div class="authors">Rut Cabus · Karen Cabello</div>
</div>

<div class="container">
  <div class="grid">

    <div class="card">

      <div class="section-title">API Controls</div>

      <div class="actions">
        <button id="btnGetStations" class="primary">Get stations</button>
        <button id="btnGetClients">Get clients</button>
      </div>

      <div class="section-title">Subscribe Client</div>

      <label>Phone</label>
      <input id="subPhone" placeholder="+346xxxxxxxx">

      <label>Stations IDs</label>
      <input id="subStations" placeholder="12,34,56">

      <label>Telegram token</label>
      <input id="subTgToken" placeholder="123:ABC">

      <label>chat_id</label>
      <input id="subChatId" placeholder="123456789">

      <div style="margin-top:24px;">
        <button id="btnSubscribe" class="primary">Subscribe</button>
      </div>

      <pre id="outSubscribe">{ }</pre>

    </div>

    <div class="card">
      <div class="section-title">Response Output</div>
      <pre id="outMain">{ }</pre>
    </div>

  </div>

  <div class="footer">
    BAN API · Aplicacions Telemàtiques
  </div>
</div>

<script src="js/ban.js"></script>

</body>
</html>
